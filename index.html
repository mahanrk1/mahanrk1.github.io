<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahan | Gamer & Streamer</title>
<meta name="description" content="Mahan plays, streams, and is learning to make games.">
<style>
:root{--bg:#12261a;--deep:#0a160f;--paper:#f5e6c4;--green:#3fae4f;--brown:#a9784a;--skin:#f1c9a0;--ink:#000}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--paper);font:18px/1.6 "Trebuchet MS","Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
html[lang=fa] body{font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.9}
a{color:inherit}
:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
h1,h2,h3{font-family:"Arial Black",Impact,Tahoma,sans-serif;line-height:1.1}
nav{position:fixed;inset:0 0 auto;z-index:10;display:flex;gap:6px;align-items:center;padding:12px clamp(14px,4vw,40px);background:linear-gradient(var(--deep),transparent)}
nav a{padding:6px 12px;text-decoration:none;font-weight:700;border-radius:4px;transition:background .2s}
nav a:hover{background:rgba(63,174,79,.25)}
nav .sp{flex:1}
#lang{font:700 16px inherit;font-family:inherit;background:var(--paper);color:#2a1a0c;border:3px solid #000;padding:5px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--green);transition:transform .15s}
#lang:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--green)}
.hero{position:relative;min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;padding:110px clamp(18px,6vw,90px) 190px;background:radial-gradient(ellipse at 80% 10%,#1d4a2c,var(--bg) 60%)}
.scene{position:absolute;inset:auto 0 0;width:100%;height:46%;pointer-events:none}
.moon{position:absolute;top:90px;inset-inline-end:7%;width:110px;height:110px;border-radius:50%;background:var(--paper);border:4px solid #000;box-shadow:0 0 70px rgba(245,230,196,.35);animation:moon 9s ease-in-out infinite alternate}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:#e3cfa3;border:3px solid #000}
.moon::before{width:26px;height:26px;top:22px;left:20px}.moon::after{width:16px;height:16px;bottom:24px;right:28px}
@keyframes moon{to{transform:translateY(14px)}}
.hero>*{position:relative;z-index:2}
.hero h1{font-size:clamp(64px,13vw,170px);color:var(--green);text-shadow:5px 5px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;animation:drop .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-60px) rotate(-4deg);opacity:0}}
.hero p{max-width:30ch;font-size:clamp(20px,2.4vw,28px);margin:14px 0 28px;animation:drop .9s .15s cubic-bezier(.3,1.5,.5,1) both}
.btns{display:flex;flex-wrap:wrap;gap:14px}
.btn{display:inline-block;padding:12px 24px;font-weight:800;text-decoration:none;color:#2a1a0c;background:var(--paper);border:3px solid #000;box-shadow:5px 5px 0 var(--green);transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.btn.g{background:var(--green);color:#000;box-shadow:5px 5px 0 #000}
.btn:hover{transform:translate(-2px,-4px) rotate(-2deg)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}
.stage{display:grid;justify-items:center;gap:14px}
.bubble{position:relative;background:var(--paper);color:#2a1a0c;border:4px solid var(--brown);border-radius:28px;padding:16px 22px;min-height:96px;width:min(100%,360px);display:grid;align-items:center;font-weight:700;text-align:center;transition:opacity .35s,transform .35s}
.bubble.out{opacity:0;transform:translateY(8px) scale(.97)}
.bubble::after{content:"";position:absolute;bottom:-20px;left:50%;margin-left:-14px;border:14px solid transparent;border-top:20px solid var(--brown);border-bottom:0}
#me{width:min(78vw,330px);cursor:pointer;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 12px 0 rgba(0,0,0,.35))}
@keyframes bob{50%{transform:translateY(-10px) rotate(1.2deg)}}
#mouth{transform-box:fill-box;transform-origin:center}
#me.talk #mouth{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.6)}to{transform:scaleY(5)}}
#me:hover #hair{transform:translateY(-5px)}#hair{transition:transform .25s}
main section{padding:90px clamp(18px,6vw,90px)}
h2{font-size:clamp(34px,5vw,56px);margin-bottom:28px;text-shadow:4px 4px 0 #000;color:var(--paper)}
.about{max-width:900px}
.about p{font-size:clamp(20px,2.3vw,26px);max-width:48ch;border-inline-start:6px solid var(--green);padding-inline-start:20px}
.cuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:30px}
.cut{background:var(--paper);color:#2a1a0c;border:3px solid #000;padding:22px;box-shadow:7px 7px 0 var(--green);transform:rotate(var(--r,0deg));transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.cut:hover{transform:rotate(0) translateY(-8px) scale(1.04)}
.cut h3{font-size:22px;margin-bottom:8px;color:#1f6b30}
.cut a{font-weight:800}
.tag{display:inline-block;margin-top:12px;background:#000;color:var(--paper);padding:3px 12px;font-size:14px;font-weight:700}
.wide{grid-column:span 2}
.soc{display:flex;flex-wrap:wrap;gap:20px;margin-top:10px}
.soc .btn{font-size:20px;padding:16px 30px}
.soc .btn:nth-child(odd){transform:rotate(-1.5deg)}.soc .btn:nth-child(even){transform:rotate(1.5deg)}
.soc .btn:hover{transform:rotate(0) translateY(-6px) scale(1.06)}
footer{padding:40px;text-align:center;background:var(--deep);border-top:4px solid #000}
@media(max-width:820px){.hero{grid-template-columns:1fr;text-align:center;padding-top:100px}.hero p{margin-inline:auto}.btns{justify-content:center}.wide{grid-column:auto}nav a.h{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav>
  <a class="h" href="#about" data-k="n1"></a><a class="h" href="#games" data-k="n2"></a><a class="h" href="#projects" data-k="n3"></a><a href="#find" data-k="n4"></a>
  <span class="sp"></span><button id="lang" type="button" aria-label="Change language"></button>
</nav>

<header class="hero">
  <svg class="scene" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="0,300 0,170 150,60 300,160 450,40 640,170 800,70 980,150 1100,90 1200,160 1200,300" fill="#0d2417" stroke="#000" stroke-width="4"/>
    <polygon points="0,300 0,230 200,150 380,230 600,140 820,235 1000,160 1200,240 1200,300" fill="var(--deep)" stroke="#000" stroke-width="4"/>
    <g stroke="#000" stroke-width="5" fill="none"><path d="M120 300V120M260 300V150M120 150H88M120 150H152"/><path d="M120 135Q190 185 260 150" stroke-width="2.5"/><path d="M260 165Q330 215 400 185" stroke-width="2.5"/></g>
  </svg>
  <div class="moon" aria-hidden="true"></div>
  <div>
    <h1 data-k="h1"></h1>
    <p data-k="role"></p>
    <div class="btns"><a class="btn g" href="https://kick.com/mahanrk" target="_blank" rel="noopener" data-k="c1"></a><a class="btn" href="#find" data-k="c2"></a></div>
  </div>
  <div class="stage">
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <svg id="me" viewBox="0 0 200 200" role="img" aria-label="Cartoon portrait of Mahan">
      <defs><clipPath id="c"><circle cx="100" cy="100" r="95"/></clipPath>
      <pattern id="st" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#3a2b22"/></pattern></defs>
      <circle cx="100" cy="100" r="95" fill="#2f9e44" stroke="#000" stroke-width="5"/>
      <g clip-path="url(#c)">
        <path d="M18 200Q30 150 100 146Q170 150 182 200Z" fill="#111" stroke="#000" stroke-width="4"/>
        <rect x="88" y="128" width="24" height="26" fill="var(--skin)" stroke="#000" stroke-width="4"/>
        <ellipse cx="100" cy="94" rx="54" ry="50" fill="var(--skin)" stroke="#000" stroke-width="4.5"/>
        <path d="M58 104Q64 142 100 146Q136 142 142 104Q128 124 100 124Q72 124 58 104Z" fill="url(#st)"/>
        <g id="hair"><path d="M46 90Q40 40 80 36L78 24L92 34Q104 20 114 34L130 26L128 40Q160 48 154 90Q146 66 128 66Q112 54 96 66Q70 58 46 90Z" fill="#1a1410" stroke="#000" stroke-width="4" stroke-linejoin="round"/></g>
        <g fill="#fff" stroke="#000" stroke-width="5"><rect x="58" y="76" width="36" height="28" rx="9"/><rect x="106" y="76" width="36" height="28" rx="9"/><path d="M94 88H106" fill="none"/></g>
        <g id="eyes" fill="#000"><circle class="pp" cx="76" cy="90" r="4.5"/><circle class="pp" cx="124" cy="90" r="4.5"/></g>
        <ellipse id="mouth" cx="100" cy="127" rx="11" ry="2.6" fill="#5a1a1a" stroke="#000" stroke-width="2.5"/>
      </g>
    </svg>
  </div>
</header>

<main>
  <section id="about" class="about"><h2 data-k="t1"></h2><p data-k="about"></p></section>

  <section id="games"><h2 data-k="t2"></h2>
    <div class="cuts">
      <div class="cut" style="--r:-2deg"><h3>GTA Vice City</h3><p data-k="g1"></p></div>
      <div class="cut" style="--r:1.5deg"><h3>Counter-Strike 2</h3><p data-k="g2"></p></div>
      <div class="cut" style="--r:-1deg"><h3>Serious Sam</h3><p data-k="g3"></p></div>
      <div class="cut" style="--r:2deg"><h3>Battlefield / War Thunder</h3><p data-k="g4"></p></div>
    </div>
  </section>

  <section id="projects"><h2 data-k="t3"></h2>
    <div class="cuts">
      <div class="cut wide" style="--r:-1deg"><h3>Dust Signal Games</h3><p data-k="p1"></p><span class="tag" data-k="wip"></span></div>
      <div class="cut" style="--r:1.5deg"><h3>@GolabiGaming</h3><p data-k="p2"></p><p><a href="https://t.me/GolabiGaming" target="_blank" rel="noopener">t.me/GolabiGaming</a></p></div>
    </div>
  </section>

  <section id="find"><h2 data-k="t4"></h2><p data-k="find"></p>
    <div class="soc">
      <a class="btn g" href="https://kick.com/mahanrk" target="_blank" rel="noopener">Kick</a>
      <a class="btn" href="https://twitch.tv/mahanrk" target="_blank" rel="noopener">Twitch</a>
      <a class="btn" href="https://youtube.com/@mahanrk" target="_blank" rel="noopener">YouTube</a>
      <a class="btn" href="https://instagram.com/mahanrk_" target="_blank" rel="noopener">Instagram</a>
    </div>
  </section>
</main>
<footer data-k="foot"></footer>

<script>
const T={
en:{n1:"About",n2:"Games",n3:"Projects",n4:"Find me",h1:"Mahan",role:"I play, I stream, and one day I'll make the games.",c1:"Watch on Kick",c2:"All my links",
t1:"Who's this guy?",about:"I've wanted to make games like Rockstar since I was a kid. Until I get there, I stream what I love, learn Unity from zero, and build small tools on the side.",
t2:"What I play",g1:"My favorite series, and the closest I've come to fully mastering one game.",g2:"Low settings, big plays. Yes, I hit an ace.",g3:"Shooting aliens here since I was a kid.",g4:"I'm here for the atmosphere.",
t3:"What I'm building",p1:"A 2.5D Unity game set in a small, run-down town. Dark humor, a sad story, and an ending that earns its redemption.",wip:"In development",p2:"Gaming news and facts, posted by a bot I built.",
t4:"Find me",find:"Pick a platform and say hi in chat.",foot:"Made by Mahan, with Claude.",
lines:["Hi, I'm Mahan. I stream, I play, and I lose professionally.","Every big streamer started with a handful of people. Welcome.","Dark humor is how I process the world. Sad ending included.","If I missed, it was lag. Only lag."],btn:"فارسی"},
fa:{n1:"درباره",n2:"بازی‌ها",n3:"پروژه‌ها",n4:"شبکه‌ها",h1:"ماهان",role:"بازی می‌کنم، استریم می‌کنم، و یه روز خودم بازی می‌سازم.",c1:"تماشا در Kick",c2:"همه لینک‌ها",
t1:"این آقا کیه؟",about:"از بچگی می‌خواستم بازی‌هایی مثل Rockstar بسازم. تا اون روز، چیزهایی که دوست دارم رو استریم می‌کنم، Unity رو از صفر یاد می‌گیرم و ابزارهای کوچیک می‌سازم.",
t2:"چی بازی می‌کنم",g1:"سریال مورد علاقه‌م، و نزدیک‌ترین چیز به مسلط شدن کامل روی یه بازی.",g2:"تنظیمات پایین، حرکت‌های بزرگ. آره، ایس زدم.",g3:"از بچگی دارم با این بازی بیگانه می‌زنم.",g4:"برای حال و هوای بازی‌شون میام.",
t3:"چی می‌سازم",p1:"بازی ۲.۵ بعدی Unity در یه شهر کوچیک و داغون. طنز تیره، داستان غمگین، و پایانی که رستگاری‌ش رو به دست میاره.",wip:"در حال ساخت",p2:"اخبار و نکته‌های گیمینگ، با باتی که خودم ساختم.",
t4:"شبکه‌ها",find:"یه پلتفرم انتخاب کن و تو چت سلام بده.",foot:"ساخته‌ی ماهان، با Claude.",
lines:["سلام، من ماهانم. استریم می‌کنم، بازی می‌کنم، و حرفه‌ای می‌بازم.","هر استریمر بزرگی یه روز با چند نفر شروع کرد. خوش اومدی.","طنز تیره راه من برای هضم دنیاست. پایان غمگین هم داریم.","اگه دیدی اشتباهی شلیک کردم، لگ بود. فقط لگ."],btn:"EN"}
};
let lang="en",i=0,timer;
lang=(navigator.language||"").startsWith("fa")?"fa":"en";
try{const s=localStorage.getItem("lang");if(s)lang=s}catch(e){}
const $=s=>document.querySelector(s),bubble=$("#bubble"),me=$("#me");
function say(){
  bubble.classList.add("out");
  setTimeout(()=>{bubble.textContent=T[lang].lines[i%4];bubble.classList.remove("out");me.classList.add("talk");setTimeout(()=>me.classList.remove("talk"),2000)},350);
}
function next(){i++;say();clearInterval(timer);timer=setInterval(next,5200)}
function apply(){
  const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="fa"?"rtl":"ltr";
  document.querySelectorAll("[data-k]").forEach(e=>e.textContent=t[e.dataset.k]);
  $("#lang").textContent=t.btn;bubble.textContent=t.lines[i%4];
  try{localStorage.setItem("lang",lang)}catch(e){}
}
$("#lang").onclick=()=>{lang=lang==="en"?"fa":"en";apply()};
me.onclick=next;
apply();setTimeout(say,600);timer=setInterval(next,5200);
const pp=document.querySelectorAll(".pp");
addEventListener("pointermove",e=>{
  const r=me.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(d,200)/200*5;
  pp.forEach(p=>p.style.transform=`translate(${dx/d*k}px,${dy/d*k}px)`);
});
</script>
</body>
</html>
